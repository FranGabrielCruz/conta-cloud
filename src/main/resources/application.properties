spring.application.name=ContaCloud
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conta_cloud}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Multi-Database. Desactivado conserva el modo local de una sola base.
contacloud.multidatabase.enabled=${MULTIDATABASE_ENABLED:false}
contacloud.directory.jdbc-url=${DIRECTORY_DB_URL:jdbc:postgresql://localhost:5432/contacloud_directory}
contacloud.directory.username=${DIRECTORY_DB_USERNAME:postgres}
contacloud.directory.password=${DIRECTORY_DB_PASSWORD:}
contacloud.routing.cache-ttl=${TENANT_ROUTING_CACHE_TTL:PT1M}
contacloud.schema.required-version=${CONTACLOUD_REQUIRED_SCHEMA_VERSION:}
# Tenant operacional usado exclusivamente durante el arranque de JPA/Flyway.
contacloud.multidatabase.bootstrap-tenant-id=${MULTIDATABASE_BOOTSTRAP_TENANT_ID:}

spring.threads.virtual.enabled=true
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# No se confían encabezados X-Forwarded-* salvo que un despliegue configure
# explícitamente un proxy conocido. El rate limit usa getRemoteAddr().
server.forward-headers-strategy=none
contacloud.locks.timeout-ms=${DB_LOCK_TIMEOUT_MS:5000}
spring.jpa.properties.jakarta.persistence.lock.timeout=${DB_LOCK_TIMEOUT_MS:5000}

# Sesion: Vaadin ignora heartbeats como actividad cuando close-idle-sessions esta activo.
server.servlet.session.timeout=${SESSION_INACTIVITY_TIMEOUT:15m}
vaadin.close-idle-sessions=true
vaadin.heartbeat-interval=60
contacloud.session.expire-after=${SESSION_INACTIVITY_TIMEOUT:15m}
contacloud.version=${CONTACLOUD_VERSION:0.0.1 }
app.storage.local.base-path=${APP_STORAGE_LOCAL_BASE_PATH:./data/contacloud}
# Clave maestra opcional (Base64 de 32+ bytes). Si no se configura, desarrollo local
# utiliza una clave aleatoria persistida fuera del repositorio bajo app.storage.local.base-path.
contacloud.security.bank-account-key=${BANK_ACCOUNT_DATA_KEY:}
contacloud.security.print-agent-key=${PRINT_AGENT_TOKEN_KEY:}
contacloud.print-agents.pairing-ttl=${PRINT_AGENT_PAIRING_TTL:PT10M}
contacloud.print-agents.pairing-max-attempts=${PRINT_AGENT_PAIRING_MAX_ATTEMPTS:5}
contacloud.print-agents.pairing-rate-limit=${PRINT_AGENT_PAIRING_RATE_LIMIT:10}
contacloud.print-agents.pairing-rate-window=${PRINT_AGENT_PAIRING_RATE_WINDOW:PT1M}
contacloud.print-agents.access-ttl=${PRINT_AGENT_ACCESS_TTL:PT15M}
contacloud.print-agents.refresh-ttl=${PRINT_AGENT_REFRESH_TTL:P30D}
contacloud.print-agents.heartbeat-write-interval=${PRINT_AGENT_HEARTBEAT_WRITE_INTERVAL:PT1M}
contacloud.print-agents.connected-tolerance=${PRINT_AGENT_CONNECTED_TOLERANCE:PT2M}
contacloud.print-agents.require-https=${PRINT_AGENT_REQUIRE_HTTPS:true}

vaadin.launch-browser=${VAADIN_LAUNCH_BROWSER:false}
logging.level.org.springframework.security=INFO

# Bootstrap opcional para una instalacion nueva. No se ejecuta si faltan valores.
contacloud.bootstrap.empresa-codigo=${BOOTSTRAP_EMPRESA_CODIGO:}
contacloud.bootstrap.empresa-nombre=${BOOTSTRAP_EMPRESA_NOMBRE:}
contacloud.bootstrap.usuario=${BOOTSTRAP_USUARIO:}
contacloud.bootstrap.password=${BOOTSTRAP_PASSWORD:}
