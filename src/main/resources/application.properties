spring.application.name=ContaCloud
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conta_cloud}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Multi-Database. Desactivado conserva el modo local de una sola base.
contacloud.multidatabase.enabled=${MULTIDATABASE_ENABLED:false}
contacloud.directory.jdbc-url=${DIRECTORY_DB_URL:jdbc:postgresql://localhost:5432/contacloud_directory}
contacloud.directory.username=${DIRECTORY_DB_USERNAME:postgres}
contacloud.directory.password=${DIRECTORY_DB_PASSWORD:}
contacloud.routing.cache-ttl=${TENANT_ROUTING_CACHE_TTL:PT1M}
contacloud.schema.required-version=${CONTACLOUD_REQUIRED_SCHEMA_VERSION:}
# Tenant operacional usado exclusivamente durante el arranque de JPA/Flyway.
contacloud.multidatabase.bootstrap-tenant-id=${MULTIDATABASE_BOOTSTRAP_TENANT_ID:}

spring.threads.virtual.enabled=true
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Sesion: Vaadin ignora heartbeats como actividad cuando close-idle-sessions esta activo.
server.servlet.session.timeout=${SESSION_INACTIVITY_TIMEOUT:15m}
vaadin.close-idle-sessions=true
vaadin.heartbeat-interval=60
contacloud.session.warning-after=${SESSION_WARNING_AFTER:14m}
contacloud.session.expire-after=${SESSION_INACTIVITY_TIMEOUT:15m}
contacloud.version=${CONTACLOUD_VERSION:0.0.1 }
app.storage.local.base-path=${APP_STORAGE_LOCAL_BASE_PATH:./data/contacloud}

vaadin.launch-browser=${VAADIN_LAUNCH_BROWSER:false}
logging.level.org.springframework.security=INFO

# Bootstrap opcional para una instalacion nueva. No se ejecuta si faltan valores.
contacloud.bootstrap.empresa-codigo=${BOOTSTRAP_EMPRESA_CODIGO:}
contacloud.bootstrap.empresa-nombre=${BOOTSTRAP_EMPRESA_NOMBRE:}
contacloud.bootstrap.usuario=${BOOTSTRAP_USUARIO:}
contacloud.bootstrap.password=${BOOTSTRAP_PASSWORD:}
